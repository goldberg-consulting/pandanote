name: Pandanote
options:
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 97UY84BV45
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  PandanoteCore:
    type: framework
    platform: macOS
    sources: [Sources/PandanoteCore]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.goldbergconsulting.pandanote.core
      GENERATE_INFOPLIST_FILE: YES
  Pandanote:
    type: application
    platform: macOS
    sources: [Sources/Pandanote]
    resources:
      - path: Resources/PandaSketch.png
      - path: Resources/AppIcon.icns
    dependencies:
      - target: PandanoteCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.goldbergconsulting.pandanote
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/Pandanote.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Copy publishing engine
        script: 'ditto "${SRCROOT}/Engine/runtime" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Engine"'
        basedOnDependencyAnalysis: false
